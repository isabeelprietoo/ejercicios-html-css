
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción al curso</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
            margin: 30px;
        }

        form {
            max-width: 600px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #1769aa;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .opcion, .privacidad {
            display: inline-block;
            width: auto;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #1769aa;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <form>
        <h1>Inscripción al curso</h1>

        <label for="nombre">Nombre y apellidos:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="dni">DNI:</label>
        <input type="text" id="dni" name="dni"
               pattern="[0-9]{8}[A-Za-z]" required>

        <label for="nacimiento">Fecha de nacimiento:</label>
        <input type="date" id="nacimiento" name="nacimiento" required>

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" required>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" required>

        <label for="ciclo">Ciclo formativo:</label>
        <select id="ciclo" name="ciclo" required>
            <option value="">Selecciona un ciclo</option>
            <option value="smr">Sistemas Microinformáticos y Redes</option>
            <option value="dam">Desarrollo de Aplicaciones Multiplataforma</option>
            <option value="daw">Desarrollo de Aplicaciones Web</option>
            <option value="asir">Administración de Sistemas Informáticos en Red</option>
        </select>

        <p>Turno preferido:</p>
        <input class="opcion" type="radio" id="manana"
               name="turno" value="mañana" required>
        <label class="opcion" for="manana">Mañana</label>

        <input class="opcion" type="radio" id="tarde"
               name="turno" value="tarde">
        <label class="opcion" for="tarde">Tarde</label>

        <label for="modalidad">Modalidad:</label>
        <select id="modalidad" name="modalidad" required>
            <option value="">Selecciona una modalidad</option>
            <option value="presencial">Presencial</option>
            <option value="semipresencial">Semipresencial</option>
            <option value="online">Online</option>
        </select>

        <p>
            <input class="privacidad" type="checkbox"
                   id="privacidad" name="privacidad" required>
            <label class="opcion" for="privacidad">
                Acepto la política de privacidad
            </label>
        </p>

        <button type="submit">Inscribirme</button>
        <button type="reset">Limpiar</button>
    </form>

</body>
</html>
